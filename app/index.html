<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Winga">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Winga Chart Plotter</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; overflow: hidden; }
      #boot-status {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0b0f14; color: #9aa5b1; font: 14px/1.4 system-ui, sans-serif;
        letter-spacing: 0.02em;
      }
      #boot-status[data-state="error"] { color: #e07a7a; text-align: center; padding: 24px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-status">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
