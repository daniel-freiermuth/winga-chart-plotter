[package]
name = "signalk-chart-core"
version = "0.1.0"
edition = "2024"
# Floor set by let-chains (stable in edition 2024 since Rust 1.88).
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
js-sys = "0.3"
phf = { version = "0.11", features = ["macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent", "Event",
  "WorkerGlobalScope",
  "Window", "Request", "RequestInit", "RequestMode", "Response", "AbortSignal",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
