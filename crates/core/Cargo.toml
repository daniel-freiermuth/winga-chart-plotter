[package]
name = "signalk-chart-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
signalk = "0.7"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
  "WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent", "Event"
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
