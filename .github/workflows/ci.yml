# .github/workflows/ci.yml
#
# CI pipeline for winga-chart-plotter-signalk
#
# Runs on every push and pull request.
# Jobs run in parallel for fast feedback:
#   lint — cargo fmt, cargo clippy, svelte-check, eslint
#   test — cargo test, vitest
#
# Concurrency: in-progress runs for the same branch/PR are cancelled when a
# newer push arrives, so stale check results never block a PR.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Incremental compilation is counterproductive in CI — each job starts fresh.
  CARGO_INCREMENTAL: '0'
  # wasm-pack pin. Keep WASM_PACK_VERSION in sync with deploy.yml,
  # .gitlab-ci.yml and the Justfile (wasm_pack_version). WASM_PACK_SHA256 is the
  # GitHub-published digest of the x86_64-unknown-linux-musl release asset.
  WASM_PACK_VERSION: '0.15.0'
  WASM_PACK_SHA256: 'c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a'

jobs:
  # ---------------------------------------------------------------------------
  # lint — Rust + TypeScript static analysis
  # Needs wasm-pack to generate app/src/wasm/ bindings before svelte-check can
  # resolve WASM imports. Uses the dev profile so the build is faster than
  # release but produces identical JS/TS type declarations.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # Pinned release asset, verified by SHA-256 rather than the auto-updating
      # installer script (a mutable page that could serve a newer version
      # without any change to this repo). GitHub release assets are not
      # immutable — upstream can re-upload them — so the checksum, not the URL,
      # is what pins the exact binary. Fetched from the wasm-bindgen org, the
      # current upstream since the rustwasm org was sunset in 2025.
      - name: Install wasm-pack (pinned)
        run: |
          asset="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "/tmp/${asset}.tar.gz" "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${asset}.tar.gz"
          echo "${WASM_PACK_SHA256}  /tmp/${asset}.tar.gz" | sha256sum -c -
          tar xzf "/tmp/${asset}.tar.gz" -C /tmp
          install -m 755 "/tmp/${asset}/wasm-pack" "$HOME/.cargo/bin/wasm-pack"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd app && pnpm install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Build WASM with the dev profile so svelte-check can resolve the
      # generated bindings in app/src/wasm/ without waiting for a release build.
      - name: Build WASM (dev) for type-checking
        run: wasm-pack build crates/core --target web --dev --out-dir ../../app/src/wasm

      - name: svelte-check
        run: cd app && pnpm exec svelte-check --tsconfig tsconfig.json

      - name: ESLint
        run: cd app && pnpm exec eslint src

  # ---------------------------------------------------------------------------
  # test — Rust unit tests + Vitest
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd app && pnpm install --frozen-lockfile

      - name: cargo test
        run: cargo test

      # trackProcessing.ts (and every other WASM-backed TS module) statically
      # imports app/src/wasm/signalk_chart_core.js — a gitignored build
      # artifact. Vitest needs it on disk before any test file that
      # transitively imports a WASM-backed module can even resolve, or the
      # whole suite fails at module-graph-build time (not a test failure).
      # Same pinned, checksum-verified install as the lint job.
      - name: Install wasm-pack (pinned)
        run: |
          asset="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "/tmp/${asset}.tar.gz" "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${asset}.tar.gz"
          echo "${WASM_PACK_SHA256}  /tmp/${asset}.tar.gz" | sha256sum -c -
          tar xzf "/tmp/${asset}.tar.gz" -C /tmp
          install -m 755 "/tmp/${asset}/wasm-pack" "$HOME/.cargo/bin/wasm-pack"

      - name: Build WASM (dev) for testing
        run: wasm-pack build crates/core --target web --dev --out-dir ../../app/src/wasm

      - name: vitest
        run: cd app && pnpm test
